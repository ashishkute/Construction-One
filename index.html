<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Construction One</title>
    <style>
        :root { --ink:#17212b; --muted:#687582; --line:#dce3e8; --paper:#fff; --canvas:#f3f6f7; --navy:#123248; --teal:#0c8a84; --amber:#e9a23b; --red:#d95d50; --green:#348b62; }
        * { box-sizing:border-box; margin:0; padding:0; font-family:Arial,sans-serif; }
        body { background:var(--canvas); color:var(--ink); }
        header { background:var(--navy); color:white; padding:20px 30px; border-bottom:4px solid var(--amber); }
        header h1 { font-size:28px; } header p { margin-top:5px; color:#c8d4da; }
        .container { max-width:1400px; margin:auto; padding:30px; }
        .welcome { margin-bottom:25px; display:flex; justify-content:space-between; gap:20px; align-items:end; }
        .welcome h2 { font-size:26px; } .welcome p { margin-top:8px; color:var(--muted); }
        .cards { display:grid; grid-template-columns:repeat(4,1fr); gap:18px; }
        .card,.module,.panel { background:var(--paper); border:1px solid var(--line); box-shadow:0 4px 16px rgba(20,50,65,.06); }
        .card { padding:22px; border-radius:8px; position:relative; overflow:hidden; }
        .card:before { content:""; width:5px; height:100%; background:var(--teal); position:absolute; left:0; top:0; }
        .card h3 { font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:12px; }
        .number { font-size:31px; font-weight:bold; }
        .modules { margin-top:36px; } .modules h2 { margin-bottom:18px; }
        .module-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:15px; }
        .module { padding:21px; border-radius:8px; cursor:pointer; transition:transform .18s,box-shadow .18s,border-color .18s; text-align:left; color:var(--ink); }
        .module:hover { transform:translateY(-3px); box-shadow:0 8px 22px rgba(20,50,65,.12); border-color:var(--teal); }
        .module span { font-size:28px; } .module h3 { margin-top:12px; } .module small { display:block; color:var(--muted); margin-top:7px; }
        footer { text-align:center; padding:30px; color:var(--muted); }
        .hidden { display:none !important; }
        .module-view { margin-top:2px; }
        .module-top { display:flex; justify-content:space-between; align-items:flex-start; gap:18px; margin-bottom:22px; }
        .module-top h2 { font-size:27px; margin-top:18px; } .module-top p { color:var(--muted); margin-top:7px; }
        button { border:0; border-radius:5px; padding:11px 15px; cursor:pointer; font-weight:bold; font-size:14px; }
        .primary { background:var(--teal); color:white; } .secondary { background:#e8eef0; color:var(--navy); }
        .danger { color:var(--red) !important; background:#fff1ef !important; } .link-button { background:none; color:var(--teal); padding:5px 8px; }
        .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px; }
        input,select { border:1px solid var(--line); border-radius:5px; padding:11px 12px; background:white; color:var(--ink); min-width:170px; }
        .search { flex:1; min-width:220px; }
        .panel { border-radius:8px; overflow:hidden; } .table-wrap { overflow-x:auto; }
        table { border-collapse:collapse; width:100%; min-width:850px; } th,td { padding:14px 15px; border-bottom:1px solid var(--line); text-align:left; white-space:nowrap; font-size:13px; } th { background:#f7f9fa; color:var(--muted); text-transform:uppercase; font-size:11px; letter-spacing:.05em; } tr:last-child td { border-bottom:0; }
        .status { display:inline-block; border-radius:20px; padding:5px 9px; font-size:11px; font-weight:bold; background:#e9f5ef; color:var(--green); } .status.pending { background:#fff4df; color:#a96b12; } .status.open { background:#fff0ed; color:var(--red); } .status.progress { background:#e8f3f5; color:#14717b; }
        .empty { padding:35px; text-align:center; color:var(--muted); }
        .modal { position:fixed; inset:0; background:rgba(10,28,38,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:2; }
        .modal-card { width:min(680px,100%); max-height:90vh; overflow:auto; background:white; border-radius:8px; padding:25px; } .modal-head { display:flex; justify-content:space-between; margin-bottom:20px; } .modal-head button { padding:3px 8px; font-size:22px; background:none; }
        .form-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; } .field { display:flex; flex-direction:column; gap:6px; } .field label { font-size:12px; color:var(--muted); font-weight:bold; } .field input,.field select { width:100%; } .form-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:22px; }
        @media (max-width:800px) { .container { padding:22px 16px; } .cards,.module-grid { grid-template-columns:repeat(2,1fr); } .module-top { flex-direction:column; } }
        @media (max-width:500px) { header { padding:18px 16px; } header h1 { font-size:23px; } .cards,.module-grid,.form-grid { grid-template-columns:1fr; } .welcome h2,.module-top h2 { font-size:23px; } .toolbar > * { width:100%; } .search { min-width:0; } }
    </style>
</head>
<body>
    <header><h1>🏗️ Construction One</h1><p>Construction Management System</p></header>
    <main class="container">
        <section id="dashboard-view">
            <div class="welcome"><div><h2>Project Dashboard</h2><p>Welcome to Construction One</p></div></div>
            <div class="cards"><div class="card"><h3>Total Projects</h3><div class="number">5</div></div><div class="card"><h3>Total Flats</h3><div class="number">200</div></div><div class="card"><h3>Completed</h3><div class="number">150</div></div><div class="card"><h3>Pending</h3><div class="number">50</div></div></div>
            <div class="modules"><h2>Modules</h2><div class="module-grid" id="module-grid"></div></div>
        </section>
        <section id="module-view" class="module-view hidden"></section>
    </main>
    <footer>Construction One © 2026</footer>
    <div id="modal-root"></div>
    <script>
        const modules = {
            projects:{title:'Projects',icon:'🏢',description:'Manage active sites, schedules and project teams.',columns:['Project Name','Client','Location','Building/Wings','Total Flats','Start Date','Planned Completion','Actual Completion','Project Manager','Status'],rows:[['Green Valley Residences','Nirman Developers','Pune','A, B, C','120','2026-01-10','2027-06-30','-','A. Sharma','In Progress'],['Metro Heights','Urban Habitat Group','Bengaluru','A, B','80','2026-02-05','2027-03-31','-','R. Iyer','Planning'],['Lakeview Villas','Horizon Estates','Mumbai','A, B, C, D','64','2025-11-12','2026-12-15','-','S. Khan','Completed']]},
            flats:{title:'Flat Tracker',icon:'🏠',description:'Track construction activity and approvals flat by flat.',columns:['Project','Wing','Floor','Flat No.','Activity','Planned Date','Actual Date','Status','Delay','Site Engineer','Photo','Project Manager Approval'],rows:[['Green Valley','A','04','A-402','Tiling','18 Sep 2026','20 Sep 2026','Delayed','2 days','N. Patil','View','Pending'],['Metro Heights','B','07','B-703','Electrical','16 Sep 2026','16 Sep 2026','Completed','0 days','K. Rao','View','Approved'],['Green Valley','C','02','C-204','Plastering','22 Sep 2026','-','Pending','-','N. Patil','Add','Pending']]},
            dpr:{title:'Daily Progress Reports',icon:'📋',description:'Review daily site progress, workforce and approvals.',columns:['Date','Project','Wing','Work Activity','Manpower','Progress %','Remarks','Photo','Submitted By','Approval Status'],rows:[['20 Sep 2026','Green Valley','A','Internal painting','24','72%','Good progress','View','N. Patil','Approved'],['20 Sep 2026','Metro Heights','B','Electrical conduit','18','58%','Material received','View','K. Rao','Pending'],['19 Sep 2026','Lakeview Villas','A','Flooring','12','100%','Floor complete','View','M. Desai','Approved']]},
            targets:{title:'Targets',icon:'🎯',description:'Monitor planned milestones against actual delivery.',columns:['Target','Project','Owner','Due Date','Progress','Status'],rows:[['Complete Level 4 masonry','Green Valley','A. Sharma','30 Sep 2026','76%','In Progress'],['Handover Block B','Metro Heights','R. Iyer','15 Oct 2026','42%','At Risk'],['Clubhouse flooring','Lakeview Villas','S. Khan','25 Sep 2026','100%','Completed']]},
            purchases:{title:'Purchase Orders',icon:'🛒',description:'Track materials, vendors, quantities and order status.',columns:['PO Number','Vendor','Project','Material','Value','Order Date','Delivery','Status'],rows:[['PO-2026-041','BuildMart Supplies','Green Valley','Cement & steel','₹4,80,000','18 Sep 2026','25 Sep 2026','Approved'],['PO-2026-042','Bright Electricals','Metro Heights','Wiring package','₹2,15,000','19 Sep 2026','29 Sep 2026','Pending'],['PO-2026-039','Tile House','Lakeview Villas','Floor tiles','₹1,76,500','12 Sep 2026','20 Sep 2026','Delivered']]},
            workorders:{title:'Work Orders',icon:'📑',description:'Assign and monitor contractor work packages.',columns:['WO Number','Scope','Contractor','Project','Assigned Date','Value','Status'],rows:[['WO-118','External plastering','Shree BuildCo','Green Valley','15 Sep 2026','₹8,40,000','In Progress'],['WO-119','Fire safety installation','SafeLine Systems','Metro Heights','18 Sep 2026','₹3,20,000','Pending'],['WO-115','Landscape package','Urban Scapes','Lakeview Villas','01 Sep 2026','₹2,10,000','Completed']]},
            snags:{title:'Snag / Desnag',icon:'⚠️',description:'Log defects, assign ownership and verify closure.',columns:['Project','Wing','Flat No.','Location','Snag Description','Contractor','Priority','Date Raised','Target Date','Status','Desnag Date','Photo'],rows:[['Green Valley','A','A-402','Kitchen','Uneven tile grout','Shree BuildCo','High','18 Sep 2026','22 Sep 2026','Open','-','View'],['Metro Heights','B','B-703','Bedroom','Paint touch-up required','ColorCraft','Medium','17 Sep 2026','21 Sep 2026','In Progress','-','View'],['Lakeview Villas','A','A-105','Balcony','Sealant gap at railing','Urban Scapes','Low','12 Sep 2026','16 Sep 2026','Closed','15 Sep 2026','View']]},
            reports:{title:'Reports',icon:'📊',description:'Quick operational summaries for construction leadership.',columns:['Report','Period','Generated By','Last Updated','Format'],rows:[['Project Progress Summary','September 2026','System','20 Sep 2026','View'],['Material Consumption','August 2026','System','01 Sep 2026','View'],['Snag Aging Report','September 2026','System','20 Sep 2026','View']]}
        };
        const projectStorageKey='construction-one-projects';
        const projectStatusOptions=['Planning','In Progress','On Hold','Completed','Cancelled'];
        function loadProjects(){ try { const saved=JSON.parse(localStorage.getItem(projectStorageKey)); if(Array.isArray(saved)) modules.projects.rows=saved; } catch(error) { localStorage.removeItem(projectStorageKey); } }
        function persistProjects(){ localStorage.setItem(projectStorageKey,JSON.stringify(modules.projects.rows)); }
        loadProjects();
        const moduleOrder=[['projects','Projects','🏢'],['flats','Flat Tracker','🏠'],['dpr','DPR','📋'],['targets','Targets','🎯'],['purchases','Purchase Orders','🛒'],['workorders','Work Orders','📑'],['snags','Snag / Desnag','⚠️'],['reports','Reports','📊']];
        let activeKey='';
        const grid=document.getElementById('module-grid');
        moduleOrder.forEach(([key,name,icon])=>{ const el=document.createElement('button'); el.className='module'; el.innerHTML=`<span>${icon}</span><h3>${name}</h3><small>Open module →</small>`; el.onclick=()=>openModule(key); grid.appendChild(el); });
        function statusClass(value){ const text=String(value).toLowerCase(); if(text.includes('pending')||text.includes('risk')) return 'pending'; if(text.includes('open')) return 'open'; if(text.includes('progress')) return 'progress'; return ''; }
        function openModule(key){ activeKey=key; const data=modules[key], statusOptions=key==='projects'?projectStatusOptions:['Pending','In Progress','Completed','Approved','Open','Closed']; document.getElementById('dashboard-view').classList.add('hidden'); const view=document.getElementById('module-view'); view.classList.remove('hidden'); view.innerHTML=`<div class="module-top"><div><button class="secondary" onclick="showDashboard()">← Back to Dashboard</button><h2>${data.icon} ${data.title}</h2><p>${data.description}</p></div><button class="primary" onclick="openForm()">+ Add New${key==='projects'?' Project':''}</button></div><div class="toolbar"><input class="search" id="search" placeholder="Search ${data.title.toLowerCase()}..." oninput="renderRows()"><select id="status-filter" onchange="renderRows()"><option value="">All statuses</option>${statusOptions.map(option=>`<option>${option}</option>`).join('')}</select><button class="secondary" onclick="resetFilters()">Reset filters</button></div><div class="panel"><div class="table-wrap"><table><thead><tr>${data.columns.map(c=>`<th>${c}</th>`).join('')}<th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div></div>`; renderRows(); window.scrollTo({top:0,behavior:'smooth'}); }
    function renderRows(){ const data=modules[activeKey], term=(document.getElementById('search')?.value||'').toLowerCase(), filter=document.getElementById('status-filter')?.value||''; const rows=data.rows.filter(row=>row.join(' ').toLowerCase().includes(term)&&(!filter||row.some(v=>String(v)===filter))); document.getElementById('rows').innerHTML=rows.length?rows.map(row=>`<tr>${row.map(value=>`<td>${['View','Add'].includes(String(value))?`<button class="link-button">${value}</button>`:(['Pending','In Progress','Completed','Approved','Open','Closed','At Risk'].includes(String(value))?`<span class="status ${statusClass(value)}">${value}</span>`:value)}</td>`).join('')}<td><button class="link-button" onclick="openForm(${data.rows.indexOf(row)})">Edit</button><button class="link-button danger" onclick="deleteRow(${data.rows.indexOf(row)})">Delete</button></td></tr>`).join(''):'<tr><td colspan="99" class="empty">No records match your filters.</td></tr>'; }
    function resetFilters(){ document.getElementById('search').value=''; document.getElementById('status-filter').value=''; renderRows(); }
    function showDashboard(){ document.getElementById('module-view').classList.add('hidden'); document.getElementById('dashboard-view').classList.remove('hidden'); window.scrollTo({top:0,behavior:'smooth'}); }
    function deleteRow(index){ if(confirm(activeKey==='projects'?'Delete this project?':'Delete this demo record?')){ modules[activeKey].rows.splice(index,1); if(activeKey==='projects') persistProjects(); renderRows(); } }
    function openForm(editIndex=null){ const data=modules[activeKey], editing=editIndex!==null, fields=activeKey==='projects'?data.columns:data.columns.slice(0,Math.min(data.columns.length,8)), existing=editing?data.rows[editIndex]:[]; document.getElementById('modal-root').innerHTML=`<div class="modal" onclick="if(event.target===this)closeForm()"><div class="modal-card"><div class="modal-head"><h2>${editing?'Edit':'Add'} ${activeKey==='projects'?'Project':data.title+' record'}</h2><button onclick="closeForm()">×</button></div><form onsubmit="saveRecord(event,${editIndex})"><div class="form-grid">${fields.map((field,index)=>`<div class="field"><label>${field}</label><input required type="${activeKey==='projects'&&field.includes('Date')?'date':'text'}" value="${existing[index]||''}" placeholder="Enter ${field.toLowerCase()}"></div>`).join('')}</div><div class="form-actions"><button type="button" class="secondary" onclick="closeForm()">Cancel</button><button class="primary">Save Record</button></div></form></div></div>`; }
    function saveRecord(event,editIndex){ event.preventDefault(); const values=[...event.target.querySelectorAll('input')].map(input=>input.value); if(editIndex===null){ while(values.length<modules[activeKey].columns.length) values.push('-'); modules[activeKey].rows.unshift(values); } else { const original=modules[activeKey].rows[editIndex]; while(values.length<modules[activeKey].columns.length) values.push(original[values.length]||'-'); modules[activeKey].rows[editIndex]=values; } if(activeKey==='projects') persistProjects(); closeForm(); renderRows(); }
    function closeForm(){ document.getElementById('modal-root').innerHTML=''; }
    </script>
</body>
</html>
